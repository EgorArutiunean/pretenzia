name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile modules
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m unittest discover -v

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check private runtime files are not tracked
        shell: bash
        run: |
          test ! -f .env
          if git ls-files 'storage/**' | grep -E '\.(xlsx|xlsm|json|zip|docx)$'; then
            echo "Private runtime artifacts must not be tracked under storage/"
            exit 1
          fi

      - name: Run CLI smoke check
        run: python -m app.main registry_template.xlsx --out storage/output/claims.zip

      - name: Build Docker image
        run: docker build -t pretenzia:ci .
